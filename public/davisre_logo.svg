<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <!-- Overlapping Translucent Architectural Blocks -->
  <g id="building-blocks">
    <!-- Block 1 (Green Left) -->
    <rect x="84" y="38" width="35" height="74" fill="#6CB877" opacity="0.75"/>
    
    <!-- Block 2 (Soft Blue) -->
    <rect x="110" y="14" width="34" height="82" fill="#7FA4DC" opacity="0.75"/>
    
    <!-- Block 3 (Green) -->
    <rect x="136" y="52" width="33" height="74" fill="#50B263" opacity="0.75"/>
    
    <!-- Block 4 (Bright Green) -->
    <rect x="162" y="26" width="35" height="82" fill="#52B768" opacity="0.75"/>
    
    <!-- Block 5 (Tall Center Green) -->
    <rect x="189" y="10" width="34" height="92" fill="#4AA45C" opacity="0.75"/>
    
    <!-- Block 6 (Soft Pale Green Inset) -->
    <rect x="210" y="32" width="24" height="70" fill="#93CE9A" opacity="0.6"/>
    
    <!-- Block 7 (Blue) -->
    <rect x="221" y="40" width="35" height="82" fill="#6A9EE0" opacity="0.75"/>
    
    <!-- Block 8 (Green Right) -->
    <rect x="247" y="14" width="35" height="82" fill="#50B263" opacity="0.7"/>
    
    <!-- Block 9 (Light Blue Right) -->
    <rect x="276" y="38" width="24" height="68" fill="#9CBEE8" opacity="0.65"/>
    
    <!-- Block 10 (Deep Blue Far Right) -->
    <rect x="278" y="38" width="35" height="78" fill="#3B8ECB" opacity="0.8"/>
  </g>

  <!-- Typography: d a v i s R E -->
  <g id="wordmark" transform="translate(200, 172)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="300" letter-spacing="18">
      <tspan fill="#505256">davis</tspan><tspan fill="#52B768" font-weight="400">RE</tspan>
    </text>
  </g>
</svg>
